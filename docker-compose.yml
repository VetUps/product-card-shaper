services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: product-card-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: product-card-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
